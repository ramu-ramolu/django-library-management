{% extends "library/base.html" %}
{% block title %}Delete Book{% endblock %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Delete "{{ object.title }}"?</h2>
  <p>This cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn gray" href="{% url 'book_detail' object.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
