{% extends "library/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" class="card" style="max-width:420px">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="row"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
  {% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn" type="submit">Login</button>
  <p class="muted">No account? <a href="{% url 'register' %}">Register</a></p>
</form>
{% endblock %}
